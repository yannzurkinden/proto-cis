version: '3.8'

# Production overrides for docker-compose.yml
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    volumes:
      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/letsencrypt/live:/etc/letsencrypt/live:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend_net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  frontend:
    restart: unless-stopped
    logging: *default-logging
    networks:
      - frontend_net

  backend:
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - DEBUG=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *default-logging
    networks:
      - frontend_net
      - backend_net
      - db_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  db:
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_backups:/backups
    logging: *default-logging
    networks:
      - db_net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    logging: *default-logging
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  minio:
    restart: unless-stopped
    ports: []  # Remove console port in production
    logging: *default-logging
    networks:
      - backend_net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true
  db_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  postgres_backups:
